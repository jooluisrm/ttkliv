<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Duelo da Live</title>

  <!-- PWA & Mobile Fullscreen Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <link rel="stylesheet" href="style.css">
  <style>
    /* PAINEL DE COMANDOS DE PRESENTES (NO CÉU DA ARENA) */
    .gifts-legend-container {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      z-index: 8;
      pointer-events: none;
    }

    .gifts-column {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      max-width: 48%;
    }

    .gifts-column.left {
      align-items: flex-start;
    }

    .gifts-column.right {
      align-items: flex-end;
    }

    .gift-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      height: 28px;
      background: rgba(0, 0, 0, 0.65);
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid rgba(255, 217, 77, 0.3);
      backdrop-filter: blur(4px);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      box-sizing: border-box;
    }

    .gifts-column.left .gift-item {
      justify-content: flex-start;
    }

    .gifts-column.right .gift-item {
      justify-content: flex-end;
    }

    .gift-item img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.8));
      flex-shrink: 0;
    }

    .gift-item span {
      font-size: clamp(9px, 1.1vh, 10.5px);
      font-weight: bold;
      color: #ffffff;
      text-shadow: 1px 1px 2px #000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>

<body>

  <div id="game">

    <!-- TÍTULO E BARRAS DE VIDA -->
    <header class="hud">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3.5%;">
        <h1 style="margin: 0; flex: 1;">Simulação</h1>
        <!-- <button id="btnFullscreen" title="Tela Cheia"
          style="background: rgba(255,255,255,0.15); border: 1px solid #ffd94d; color: #ffd94d; font-size: 14px; font-weight: bold; padding: 4px 8px; border-radius: 4px; cursor: pointer; z-index: 30;">⛶
          FULL</button> -->
      </div>

      <div class="health-bars">

        <div class="health-box">
          <div class="fighter-name">KIM KATAGUIRI</div>

          <div class="health-track">
            <div class="health-fill" id="hpLula"></div>
          </div>

          <span id="textLula">100 HP</span>
        </div>

        <div class="health-box right">
          <div class="fighter-name">NIKOLAS FERREIRA</div>

          <div class="health-track">
            <div class="health-fill" id="hpBolsonaro"></div>
          </div>

          <span id="textBolsonaro">100 HP</span>
        </div>

      </div>

      <div class="versus">VS</div>
    </header>


    <!-- ARENA -->
    <main class="arena">

      <!-- ================================================================= -->
      <!-- PAINEL DE COMANDOS DE PRESENTES (Comentar esta DIV para remover) -->
      <!-- ================================================================= -->
      <div class="gifts-legend-container">
        <div class="gifts-column left">
          <div class="gift-item"><img src="icones/tiktok-heart.png" alt="Curtidas"> <span>50 Curtidas = Soco</span>
          </div>
          <div class="gift-item"><img src="icones/rose.webp" alt="Rose"> <span>Rose = Soco</span></div>
          <div class="gift-item"><img src="icones/tiny-diny.webp" alt="Tiny Diny"> <span>Tiny Diny = Combo</span></div>
          <div class="gift-item"><img src="icones/confetti.webp" alt="Confetti"> <span>Confetti = Especial</span></div>
        </div>
        <div class="gifts-column right">
          <div class="gift-item"><span>10 Seguir = Soco</span> <img src="icones/seguir.png" alt="Seguir"></div>
          <div class="gift-item"><span>GG = Soco</span> <img src="icones/gg.webp" alt="GG"></div>
          <div class="gift-item"><span>Heart = Combo</span> <img src="icones/heart.webp" alt="Heart"></div>
          <div class="gift-item"><span>Earthling = Especial</span> <img src="icones/heart-my-earthling.webp"
              alt="Earthling"></div>
        </div>
      </div>

      <!-- ================================================================= -->

      <!-- CENÁRIO -->
      <div class="arena-background">
        <div class="sun"></div>
        <div class="building left-building"></div>
        <div class="building right-building"></div>
        <div class="arena-floor"></div>
      </div>


      <!-- LUTADOR: KIM -->
      <div class="fighter lula" id="lula">

        <img id="spriteLula" src="sprites/kim/kim-idle.png" alt="Kim em pixel art">

        <div class="placeholder">
          <div class="head"></div>
          <div class="torso"></div>
          <div class="arm"></div>
          <div class="legs"></div>
        </div>

        <div class="fighter-shadow"></div>

      </div>


      <!-- LUTADOR: NIKOLAS -->
      <div class="fighter bolsonaro" id="bolsonaro">

        <img id="spriteBolsonaro" src="sprites/nikolas/nikolas-idle.png" alt="Nikolas em pixel art">

        <div class="placeholder">
          <div class="head"></div>
          <div class="torso"></div>
          <div class="arm"></div>
          <div class="legs"></div>
        </div>

        <div class="fighter-shadow"></div>

      </div>


      <!-- EFEITOS DOS GOLPES -->
      <div id="impact" class="impact"></div>

      <!-- BOLA DE ENERGIA DO ESPECIAL -->
      <div id="energiaEspecial" class="energia-especial"></div>


      <!-- TELA DE K.O. -->
      <div id="koOverlay" class="ko-overlay hidden">
        <div class="ko-title">K.O.!</div>
        <div id="winnerText" class="winner-text"></div>
      </div>

    </main>


    <!-- PLACAR -->
    <section class="scoreboard">

      <h2>🏆 VITÓRIAS</h2>

      <div class="score-row">

        <div class="score lula-score">
          <span>KIM</span>
          <strong id="winsLula">0</strong>
        </div>

        <div class="round-box">
          <span>RODADA</span>
          <strong id="roundNumber">1</strong>
        </div>

        <div class="score bolsonaro-score">
          <span>NIKOLAS</span>
          <strong id="winsBolsonaro">0</strong>
        </div>

      </div>

    </section>

  </div>


  <!-- SOCKET.IO: CONEXÃO COM O SERVIDOR -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- MOTOR DO JOGO -->
  <script src="game.js"></script>

  <!-- INTEGRAÇÃO COM OS PRESENTES DO TIKTOK -->
  <script src="tiktok-duelo.js"></script>

  <!-- REGISTRO PWA SERVICE WORKER & FULLSCREEN -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => { });
      });
    }

    const btnFull = document.getElementById('btnFullscreen');
    if (btnFull) {
      btnFull.addEventListener('click', () => {
        const docEl = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          if (docEl.requestFullscreen) {
            docEl.requestFullscreen();
          } else if (docEl.webkitRequestFullscreen) {
            docEl.webkitRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        }
      });
    }
  </script>
</body>

</html>
