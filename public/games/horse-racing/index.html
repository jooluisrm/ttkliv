<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Corrida da Live</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>

    <!-- ========================================
         CANVAS DA CORRIDA
         ======================================== -->
    <canvas id="raceCanvas"></canvas>


    <!-- ========================================
         PLACAR DE VITÓRIAS
         ======================================== -->
    <div id="victoryBoard">

      <div class="victory-title">
        🏆 VITÓRIAS
      </div>

      <div id="victoryList"></div>

    </div>


    <!-- ========================================
         HUD
         ======================================== -->
    <div id="hud">

      <!-- Banner da fase -->
      <div id="phaseBanner" class="phase-banner">

        <span id="phaseText">
          Aguardando comentários ou presentes...
        </span>

        <span id="phaseTimer"></span>

      </div>


      <!--
        Mantemos estes elementos porque o
        game.js ainda utiliza eles.
        Eles ficam escondidos pelo CSS.
      -->

      <div id="laneLabels"></div>

      <div id="eventFeed"></div>


      <!-- ======================================
           TELA DO VENCEDOR
           ====================================== -->
      <div
        id="winnerOverlay"
        class="winner-overlay hidden"
      >

        <div class="winner-content">

          <div
            id="winnerEmoji"
            class="winner-emoji"
          ></div>

          <div
            id="winnerName"
            class="winner-name"
          ></div>

          <div
            id="winnerSupporters"
            class="winner-supporters"
          ></div>

        </div>

      </div>

    </div>


    <!-- ========================================
         SCRIPTS
         ======================================== -->

    <script src="/socket.io/socket.io.js"></script>

    <script src="/lib/tiktok-bridge.js"></script>

    <script src="config.js"></script>

    <script src="race-engine.js"></script>

    <script src="game.js"></script>

  </body>
</html>
